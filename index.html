<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みんなで作るハザードマップ - 大阪公立大高専周辺</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        /* カスタムマーカー用のスタイル */
        .custom-marker-icon {
            background: none;
            border: none;
        }
        .marker-pin {
            width: 32px;
            height: 32px;
            border-radius: 50% 50% 50% 0;
            position: absolute;
            transform: rotate(-45deg);
            left: 50%;
            top: 50%;
            margin: -16px 0 0 -16px;
            box-shadow: -2px 2px 6px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .marker-pin::after {
            content: '';
            width: 14px;
            height: 14px;
            background: #fff;
            position: absolute;
            border-radius: 50%;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
        }
        
        /* ポップアップのスタイル微調整 */
        .leaflet-popup-content-wrapper {
            border-radius: 0.75rem;
            padding: 0;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .leaflet-popup-content {
            margin: 0;
            width: 260px !important;
        }
        .leaflet-popup-tip-container {
            margin-top: -1px; /* 隙間を埋める */
        }
        
        /* サイドバーのスクロールバーを非表示にしつつスクロール可能に */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen bg-gray-100 font-sans text-gray-800 overflow-hidden">

    <!-- Header -->
    <header class="bg-indigo-700 text-white p-3 md:p-4 shadow-md z-20 flex justify-between items-center relative flex-shrink-0">
        <div class="flex items-center gap-3">
            <div class="p-1.5 md:p-2 bg-indigo-800 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6 text-indigo-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                </svg>
            </div>
            <div>
                <h1 class="text-base md:text-xl font-bold tracking-wide flex items-center">
                    ハザードマップ <span class="text-[10px] md:text-xs ml-2 bg-indigo-500 px-1.5 py-0.5 rounded text-indigo-50">DEMO</span>
                </h1>
                <p class="text-[10px] md:text-sm text-indigo-200 hidden md:block">大阪公立大学工業高等専門学校 周辺</p>
            </div>
        </div>
        <div class="flex items-center gap-2 md:gap-3">
            <button id="line-share-btn" class="bg-[#06C755] hover:bg-[#05b34c] text-white text-xs md:text-sm px-3 py-1.5 rounded-full font-bold shadow transition-colors flex items-center gap-1.5">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                    <path d="M22.5 10.19C22.5 5.25 17.78 1.25 12 1.25S1.5 5.25 1.5 10.19c0 4.43 3.86 8.19 9 8.84.35.07.83.22.95.52.1.28.06.72.03 1.01l-.16 1.01c-.04.25-.19.95.83.52 1.03-.43 5.56-3.28 7.82-5.77 1.63-1.78 2.53-3.9 2.53-6.13z"/>
                </svg>
                <span class="hidden sm:inline">LINE共有</span>
            </button>
            <div id="auth-status" class="text-xs md:text-sm bg-indigo-800 text-indigo-100 px-2 md:px-3 py-1.5 rounded-full flex items-center gap-1.5 transition-colors duration-300">
                <span class="w-1.5 h-1.5 md:w-2 md:h-2 rounded-full bg-gray-400 animate-pulse" id="auth-dot"></span>
                <span id="auth-text" class="hidden sm:inline">接続中...</span>
            </div>
        </div>
    </header>

    <!-- Main Dashboard Layout -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Sidebar / Bottom Panel -->
        <aside class="w-full md:w-80 lg:w-96 bg-white shadow-[0_0_15px_rgba(0,0,0,0.1)] flex flex-col z-10 order-2 md:order-1 h-[45vh] md:h-full flex-shrink-0">
            
            <!-- Instructions & Legend -->
            <div class="p-4 border-b border-gray-100 bg-gray-50 flex-shrink-0">
                
                <!-- Mode Toggle -->
                <div class="mb-4 bg-white p-1 rounded-xl border border-gray-200 shadow-sm flex text-sm text-center relative z-20">
                    <button id="mode-view" class="flex-1 py-2 rounded-lg bg-indigo-600 text-white font-bold transition-all shadow-sm">閲覧モード</button>
                    <button id="mode-add" class="flex-1 py-2 rounded-lg text-gray-500 hover:bg-gray-50 font-bold transition-all">追加モード</button>
                </div>

                <div id="mode-instruction" class="bg-indigo-50 text-indigo-800 text-xs p-3 rounded-lg flex items-start gap-2 mb-3 border border-indigo-100 shadow-sm hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-500 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
                    </svg>
                    <p>マップ上の任意の場所を<strong>クリック（タップ）</strong>して、情報を登録・共有しましょう。</p>
                </div>
                
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">凡例 (Legend)</h3>
                <div class="flex gap-2 text-xs">
                    <div class="flex items-center gap-1.5 bg-white px-2 py-1.5 rounded shadow-sm border border-gray-100 flex-1 justify-center">
                        <div class="w-3 h-3 rounded-full bg-red-500"></div><span class="font-medium text-gray-700">危険</span>
                    </div>
                    <div class="flex items-center gap-1.5 bg-white px-2 py-1.5 rounded shadow-sm border border-gray-100 flex-1 justify-center">
                        <div class="w-3 h-3 rounded-full bg-amber-500"></div><span class="font-medium text-gray-700">注意</span>
                    </div>
                    <div class="flex items-center gap-1.5 bg-white px-2 py-1.5 rounded shadow-sm border border-gray-100 flex-1 justify-center">
                        <div class="w-3 h-3 rounded-full bg-emerald-500"></div><span class="font-medium text-gray-700">避難所</span>
                    </div>
                </div>
            </div>

            <!-- Marker List -->
            <div class="flex-1 overflow-y-auto no-scrollbar bg-white p-2">
                <div class="px-2 pt-2 pb-1 flex justify-between items-center sticky top-0 bg-white/90 backdrop-blur-sm z-10 border-b border-gray-50 mb-2">
                    <h3 class="text-sm font-bold text-gray-700 flex items-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" />
                        </svg>
                        登録リスト
                    </h3>
                    <span id="list-count" class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full font-medium">0件</span>
                </div>
                <div id="marker-list" class="flex flex-col gap-2 pb-4">
                    <!-- 読み込み中スケルトン -->
                    <div class="animate-pulse flex space-x-4 p-3 border border-gray-100 rounded-lg">
                        <div class="rounded-full bg-gray-200 h-8 w-8"></div>
                        <div class="flex-1 space-y-2 py-1">
                            <div class="h-3 bg-gray-200 rounded w-3/4"></div>
                            <div class="h-2 bg-gray-200 rounded w-1/2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Map Container -->
        <div id="map" class="flex-1 w-full order-1 md:order-2 h-[55vh] md:h-full z-0 relative cursor-grab"></div>
    </main>

    <!-- Add Marker Modal (Hidden by default) -->
    <div id="addModal" class="fixed inset-0 bg-gray-900/60 hidden z-[1000] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-hidden flex flex-col transform transition-transform scale-100">
            <div class="bg-indigo-50 px-5 py-4 border-b border-indigo-100 flex justify-between items-center">
                <h2 class="text-lg font-bold text-indigo-900 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-600" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
                    </svg>
                    地点情報の登録
                </h2>
                <button type="button" id="btn-close" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <div class="p-5 flex-grow overflow-y-auto no-scrollbar">
                <div id="modal-error" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                    <span>必須項目を正しく入力してください。</span>
                </div>
                
                <form id="markerForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">タイトル <span class="text-red-500 text-xs">*</span></label>
                        <input type="text" id="m-title" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-2.5 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition shadow-sm" placeholder="例: 大雨時に冠水する道路" required>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">種類 <span class="text-red-500 text-xs">*</span></label>
                            <select id="m-type" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-2.5 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="災害">災害</option>
                                <option value="日常">日常</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">危険度 <span class="text-red-500 text-xs">*</span></label>
                            <select id="m-danger-level" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-2.5 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="高">高</option>
                                <option value="中">中</option>
                                <option value="低">低</option>
                            </select>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">カテゴリー <span class="text-red-500 text-xs">*</span></label>
                        <div class="grid grid-cols-3 gap-3">
                            <!-- Danger -->
                            <label class="cursor-pointer relative">
                                <input type="radio" name="category" value="danger" class="peer sr-only" required>
                                <div class="text-center p-2 rounded-xl border-2 border-gray-200 peer-checked:border-red-500 peer-checked:bg-red-50 transition hover:bg-gray-50 shadow-sm peer-checked:shadow-md">
                                    <div class="w-4 h-4 rounded-full bg-red-500 mx-auto mb-1 shadow-sm"></div>
                                    <span class="text-xs font-bold text-gray-700 block">危険</span>
                                </div>
                            </label>
                            <!-- Caution -->
                            <label class="cursor-pointer relative">
                                <input type="radio" name="category" value="caution" class="peer sr-only">
                                <div class="text-center p-2 rounded-xl border-2 border-gray-200 peer-checked:border-amber-500 peer-checked:bg-amber-50 transition hover:bg-gray-50 shadow-sm peer-checked:shadow-md">
                                    <div class="w-4 h-4 rounded-full bg-amber-500 mx-auto mb-1 shadow-sm"></div>
                                    <span class="text-xs font-bold text-gray-700 block">注意</span>
                                </div>
                            </label>
                            <!-- Shelter -->
                            <label class="cursor-pointer relative">
                                <input type="radio" name="category" value="shelter" class="peer sr-only">
                                <div class="text-center p-2 rounded-xl border-2 border-gray-200 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 transition hover:bg-gray-50 shadow-sm peer-checked:shadow-md">
                                    <div class="w-4 h-4 rounded-full bg-emerald-500 mx-auto mb-1 shadow-sm"></div>
                                    <span class="text-xs font-bold text-gray-700 block">避難所</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">詳細な説明 <span class="text-red-500 text-xs">*</span></label>
                        <textarea id="m-desc" rows="2" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-2.5 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition shadow-sm resize-none" placeholder="現地の状況を詳しく教えてください" required></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">現地の写真 (任意)</label>
                        <input type="file" id="m-image" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition">
                    </div>
                </form>
            </div>
            
            <div class="px-5 py-4 bg-gray-50 border-t border-gray-100 flex justify-end space-x-3">
                <button type="button" id="btn-cancel" class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 transition focus:outline-none focus:ring-2 focus:ring-gray-200 shadow-sm">
                    キャンセル
                </button>
                <button type="button" id="btn-save" class="px-5 py-2.5 text-sm font-medium text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition focus:outline-none focus:ring-2 focus:ring-indigo-500 flex items-center shadow-md hover:shadow-lg">
                    <span id="save-spinner" class="hidden mr-2 w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                    <svg id="save-icon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                    投稿して共有
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global configuration variables provided by the environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'demo-hazard-map';
        const fbConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "mock-key", projectId: "mock-project" 
        };
        const initAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // Initialize Firebase
        const app = initializeApp(fbConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Required Firestore path format for public sharing apps (RULE 1)
        const collectionPath = `artifacts/${appId}/public/data/hazards_demo`;
        let user = null;

        // UI Elements
        const authDot = document.getElementById('auth-dot');
        const authText = document.getElementById('auth-text');
        const modal = document.getElementById('addModal');
        const btnCancel = document.getElementById('btn-cancel');
        const btnClose = document.getElementById('btn-close');
        const btnSave = document.getElementById('btn-save');
        const mTitle = document.getElementById('m-title');
        const mType = document.getElementById('m-type');
        const mDangerLevel = document.getElementById('m-danger-level');
        const mDesc = document.getElementById('m-desc');
        const mImage = document.getElementById('m-image');
        const modalError = document.getElementById('modal-error');
        const saveSpinner = document.getElementById('save-spinner');
        const saveIcon = document.getElementById('save-icon');
        const lineShareBtn = document.getElementById('line-share-btn');
        const markerListContainer = document.getElementById('marker-list');
        const listCount = document.getElementById('list-count');
        const mapEl = document.getElementById('map');
        const modeViewBtn = document.getElementById('mode-view');
        const modeAddBtn = document.getElementById('mode-add');
        const modeInstruction = document.getElementById('mode-instruction');

        let currentMode = 'view'; // 'view' | 'add'

        // Mode Switch Logic
        function switchMode(mode) {
            currentMode = mode;
            if (mode === 'view') {
                modeViewBtn.classList.replace('text-gray-500', 'text-white');
                modeViewBtn.classList.replace('hover:bg-gray-50', 'bg-indigo-600');
                modeViewBtn.classList.add('shadow-sm');
                modeAddBtn.classList.replace('text-white', 'text-gray-500');
                modeAddBtn.classList.replace('bg-indigo-600', 'hover:bg-gray-50');
                modeAddBtn.classList.remove('shadow-sm');
                mapEl.classList.replace('cursor-crosshair', 'cursor-grab');
                modeInstruction.classList.add('hidden');
            } else {
                modeAddBtn.classList.replace('text-gray-500', 'text-white');
                modeAddBtn.classList.replace('hover:bg-gray-50', 'bg-indigo-600');
                modeAddBtn.classList.add('shadow-sm');
                modeViewBtn.classList.replace('text-white', 'text-gray-500');
                modeViewBtn.classList.replace('bg-indigo-600', 'hover:bg-gray-50');
                modeViewBtn.classList.remove('shadow-sm');
                mapEl.classList.replace('cursor-grab', 'cursor-crosshair');
                modeInstruction.classList.remove('hidden');
            }
        }
        modeViewBtn.addEventListener('click', () => switchMode('view'));
        modeAddBtn.addEventListener('click', () => switchMode('add'));

        // LINE Share button logic
        if (lineShareBtn) {
            lineShareBtn.addEventListener('click', () => {
                const text = encodeURIComponent('【デモ版】みんなで作るハザードマップ（大阪公立大高専周辺）\n地図上の危険箇所や避難所をリアルタイムで共有しよう！\n');
                const url = encodeURIComponent(window.location.href);
                window.open(`https://line.me/R/msg/text/?${text}${url}`, '_blank');
            });
        }

        // Map setup (Centered on Osaka Metropolitan University College of Technology)
        const INITIAL_LAT = 34.7644;
        const INITIAL_LNG = 135.6269;
        const INITIAL_ZOOM = 16;
        
        let pendingLatLng = null;
        let markersLayer = L.layerGroup();
        // マーカーインスタンスを保持してリストからポップアップを開けるようにする
        const mapMarkers = {}; 

        // Initialize Leaflet map
        const map = L.map('map', {
            zoomControl: false // Move to bottom right
        }).setView([INITIAL_LAT, INITIAL_LNG], INITIAL_ZOOM);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        markersLayer.addTo(map);

        // Marker Colors & Labels Mapping
        const markerStyles = {
            danger: { color: '#ef4444', label: '危険', headerBg: 'bg-red-500', badgeClass: 'bg-red-100 text-red-800' },
            caution: { color: '#f59e0b', label: '注意', headerBg: 'bg-amber-500', badgeClass: 'bg-amber-100 text-amber-800' },
            shelter: { color: '#10b981', label: '避難所', headerBg: 'bg-emerald-500', badgeClass: 'bg-emerald-100 text-emerald-800' }
        };

        // Create Custom DivIcon
        function createCustomIcon(category) {
            const color = markerStyles[category]?.color || '#6b7280';
            return L.divIcon({
                className: 'custom-marker-icon',
                iconAnchor: [0, 16],
                popupAnchor: [0, -28],
                html: `<div class="marker-pin" style="background-color: ${color};"></div>`
            });
        }

        // Map click event -> open modal (Only in Add Mode)
        map.on('click', (e) => {
            if (!user || currentMode !== 'add') return;
            pendingLatLng = e.latlng;
            openModal();
        });

        // リサイズ時のマップの再描画（レイアウト崩れ防止）
        window.addEventListener('resize', () => {
            map.invalidateSize();
        });

        function openModal() {
            modal.classList.remove('hidden');
            mTitle.value = '';
            mDesc.value = '';
            mImage.value = '';
            const radios = document.getElementsByName('category');
            radios.forEach(r => r.checked = false);
            modalError.classList.add('hidden');
            setTimeout(() => mTitle.focus(), 100);
        }

        function closeModal() {
            modal.classList.add('hidden');
            pendingLatLng = null;
        }

        btnCancel.addEventListener('click', closeModal);
        btnClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal(); // Click outside to close
        });

        // 画像の圧縮処理 (Base64化してFirestoreに保存可能にする)
        async function compressImage(file) {
            if (!file) return null;
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400; // Firebase保存容量を抑えるためのリサイズ
                        let scale = MAX_WIDTH / img.width;
                        if (scale > 1) scale = 1;
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // Save logic
        btnSave.addEventListener('click', async () => {
            if (!pendingLatLng || !user) return;

            const title = mTitle.value.trim();
            const desc = mDesc.value.trim();
            const typeVal = mType.value;
            const dangerLevelVal = mDangerLevel.value;
            const categoryChecked = document.querySelector('input[name="category"]:checked');
            const file = mImage.files[0];

            if (!title || !desc || !categoryChecked) {
                modalError.classList.remove('hidden');
                return;
            }

            const category = categoryChecked.value;
            
            modalError.classList.add('hidden');
            btnSave.disabled = true;
            btnCancel.disabled = true;
            saveSpinner.classList.remove('hidden');
            saveIcon.classList.add('hidden');

            try {
                // 画像を圧縮 (Base64)
                let base64Image = null;
                if (file) {
                    base64Image = await compressImage(file);
                }

                // Add to Firestore (RULE 3: Authenticated user checked above)
                const hazardsRef = collection(db, collectionPath);
                await addDoc(hazardsRef, {
                    title: title,
                    description: desc,
                    incidentType: typeVal,
                    dangerLevel: dangerLevelVal,
                    category: category,
                    imageData: base64Image,
                    lat: pendingLatLng.lat,
                    lng: pendingLatLng.lng,
                    timestamp: new Date().toISOString(),
                    userId: user.uid
                });
                closeModal();
                switchMode('view'); // 登録後は自動的に閲覧モードに戻す
            } catch (error) {
                console.error("Error adding document: ", error);
                modalError.querySelector('span').textContent = "保存に失敗しました。再試行してください。";
                modalError.classList.remove('hidden');
            } finally {
                btnSave.disabled = false;
                btnCancel.disabled = false;
                saveSpinner.classList.add('hidden');
                saveIcon.classList.remove('hidden');
            }
        });

        // Generate popup HTML
        function generatePopupContent(data) {
            const style = markerStyles[data.category] || markerStyles.caution;
            const safeTitle = (data.title || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const safeDesc = (data.description || "").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, '<br>');
            const dateStr = new Date(data.timestamp).toLocaleString('ja-JP', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            
            return `
                <div class="w-full overflow-hidden flex flex-col">
                    ${data.imageData ? `<img src="${data.imageData}" class="w-full h-32 object-cover border-b border-gray-100" />` : ''}
                    <div class="${style.headerBg} px-4 py-2 flex justify-between items-center text-white">
                        <span class="text-xs font-bold tracking-wider">${style.label}</span>
                        <span class="text-[10px] opacity-80">${dateStr}</span>
                    </div>
                    <div class="p-4 bg-white">
                        <div class="flex gap-2 mb-2 text-[10px] font-bold">
                            <span class="bg-gray-100 text-gray-600 px-2 py-0.5 rounded">${data.incidentType || '災害'}</span>
                            <span class="bg-gray-100 text-gray-600 px-2 py-0.5 rounded">危険度: ${data.dangerLevel || '未設定'}</span>
                        </div>
                        <h3 class="font-bold text-gray-900 text-base leading-tight mb-2">${safeTitle}</h3>
                        <p class="text-gray-600 text-sm mt-1 max-h-24 overflow-y-auto break-words leading-relaxed">${safeDesc}</p>
                    </div>
                </div>
            `;
        }

        // リストアイテムの生成
        function createListItem(data, docId) {
            const style = markerStyles[data.category] || markerStyles.caution;
            const safeTitle = (data.title || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            // 時間表記（例: 今日 14:30、昨日 09:15）
            const date = new Date(data.timestamp);
            const timeStr = date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
            const dateStr = date.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric' });

            const div = document.createElement('div');
            div.className = "group flex items-start gap-3 p-3 bg-white border border-gray-100 rounded-xl hover:border-indigo-300 hover:shadow-md transition-all cursor-pointer";
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 shadow-sm text-white text-xs font-bold" style="background-color: ${style.color};">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-start mb-0.5">
                        <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${style.badgeClass}">${style.label}</span>
                        <span class="text-[10px] text-gray-400 group-hover:text-indigo-500 transition-colors">${dateStr} ${timeStr}</span>
                    </div>
                    <p class="text-sm font-bold text-gray-800 truncate">${safeTitle}</p>
                </div>
            `;
            
            // クリック時にマップ移動＆ポップアップ表示
            div.addEventListener('click', () => {
                map.flyTo([data.lat, data.lng], 18, { animate: true, duration: 1.5 });
                setTimeout(() => {
                    if (mapMarkers[docId]) {
                        mapMarkers[docId].openPopup();
                    }
                }, 1500); // フライト終了後くらいに開く
            });

            return div;
        }

        // Initialize Application / Authentication
        async function initApp() {
            try {
                // RULE 3: Auth before queries
                if (initAuthToken) {
                    await signInWithCustomToken(auth, initAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                
                user = auth.currentUser;
                
                authDot.classList.replace('bg-gray-400', 'bg-emerald-400');
                authText.textContent = '同期中';

                startSync();
                
                // 初回描画のためサイズを再計算
                setTimeout(() => { map.invalidateSize(); }, 500);

            } catch (error) {
                console.error("Authentication failed:", error);
                authDot.classList.replace('bg-gray-400', 'bg-red-500');
                authDot.classList.remove('animate-pulse');
                authText.textContent = 'オフライン';
                markerListContainer.innerHTML = '<div class="text-center p-4 text-sm text-red-500">認証エラーが発生しました。</div>';
            }
        }

        // Real-time synchronization
        function startSync() {
            if (!user) return;
            
            // RULE 2: No complex queries, fetch all from collection
            const q = query(collection(db, collectionPath));
            
            onSnapshot(q, (snapshot) => {
                markersLayer.clearLayers(); 
                for (let key in mapMarkers) delete mapMarkers[key]; // リセット
                
                const hazards = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.lat && data.lng) {
                        hazards.push({ id: doc.id, ...data });
                    }
                });

                // 新しい順（降順）にソート (RULE 2対応)
                hazards.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                
                listCount.textContent = `${hazards.length}件`;
                markerListContainer.innerHTML = '';

                if (hazards.length === 0) {
                    markerListContainer.innerHTML = '<div class="text-center p-6 text-sm text-gray-400">まだ登録された情報はありません。</div>';
                    return;
                }

                hazards.forEach(data => {
                    // マーカーをマップに追加
                    const marker = L.marker([data.lat, data.lng], {
                        icon: createCustomIcon(data.category)
                    });
                    
                    marker.bindPopup(generatePopupContent(data), {
                        className: 'custom-popup',
                        minWidth: 260
                    });
                    
                    markersLayer.addLayer(marker);
                    mapMarkers[data.id] = marker; // リストからの参照用に保存

                    // リストにアイテムを追加
                    markerListContainer.appendChild(createListItem(data, data.id));
                });
            }, (error) => {
                console.error("Realtime sync error: ", error); 
                authDot.classList.replace('bg-emerald-400', 'bg-red-500');
                authText.textContent = '同期エラー';
            });
        }

        // Boot up
        initApp();
    </script>
</body>
</html>
